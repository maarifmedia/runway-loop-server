# 3. KLASÖRÜ BUL (Kök dizin veya assets içi hata koruması)
        MUSIC_DIR=""
        if [ -d "music" ]; then
          MUSIC_DIR="music"
        elif [ -d "assets/music" ]; then
          MUSIC_DIR="assets/music"
        fi
        
        # 3.5 ARA İSTASYON: 16 SANİYELİK PING-PONG DÖNGÜSÜ OLUŞTURMA
        echo "Kamera zıplamasını engellemek için Ping-Pong (İleri-Geri) kurgusu yapılıyor..."
        HAS_ORIGINAL_AUDIO=$(ffprobe -i assets/current_video.mp4 -show_streams -select_streams a -loglevel error)
        
        if [ -z "$HAS_ORIGINAL_AUDIO" ]; then
          # Ses yoksa sadece görüntüyü ping-pong yap
          ffmpeg -y -i assets/current_video.mp4 -filter_complex "[0:v]reverse[r];[0:v][r]concat=n=2:v=1:a=0[v]" -map "[v]" -c:v libx264 -crf 23 assets/pingpong_video.mp4
        else
          # Ses varsa görüntüyü ileri-geri, sesi ise düz peş peşe (ters dalga sesi olmasın diye) birleştir
          ffmpeg -y -i assets/current_video.mp4 -filter_complex "[0:v]reverse[r];[0:v][r]concat=n=2:v=1:a=0[v];[0:a][0:a]concat=n=2:v=0:a=1[a]" -map "[v]" -map "[a]" -c:v libx264 -crf 23 -c:a aac -b:a 192k assets/pingpong_video.mp4
        fi
        
        # 4. MİKSLEME VEYA DOĞA SESİ OLUŞTURMA (Senin Orijinal Kusursuz Yapın)
        if [ "$IS_MELODIC" = true ] && [ "$MUSIC_DIR" != "" ]; then
          echo "Melodik konsept algilandi! $MUSIC_DIR klasorunden rastgele muzik ekleniyor..."
          RANDOM_MUSIC=$(find "$MUSIC_DIR" -type f -name "*.mp3" | shuf -n 1)
          
          if [ -z "$RANDOM_MUSIC" ]; then
            echo "UYARI: Muzik klasoru bos! Guvenlik amaciyla muziksiz devam ediliyor..."
            ffmpeg -y -stream_loop -1 -i assets/pingpong_video.mp4 -t 3600 -c copy assets/final_main.mp4
          else
            echo "Secilen muzik: $RANDOM_MUSIC"
            HAS_AUDIO=$(ffprobe -i assets/pingpong_video.mp4 -show_streams -select_streams a -loglevel error)
            
            if [ -z "$HAS_AUDIO" ]; then
              echo "Videoda ses kanali bulunamadi! Sagir video tespit edildi, sadece muzik ekleniyor..."
              ffmpeg -y -stream_loop -1 -i assets/pingpong_video.mp4 -stream_loop -1 -i "$RANDOM_MUSIC" -t 3600 -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k assets/final_main.mp4
            else
              echo "Videoda ses kanali bulundu! Ambiyans ile muzik miksleniyor..."
              ffmpeg -y -stream_loop -1 -i assets/pingpong_video.mp4 -stream_loop -1 -i "$RANDOM_MUSIC" -t 3600 -filter_complex "[0:a]volume=0.7[amb];[1:a]volume=0.3[mus];[amb][mus]amix=inputs=2:duration=first[aout]" -map 0:v -map "[aout]" -c:v copy -c:a aac -b:a 192k assets/final_main.mp4
            fi
          fi
        else
          echo "Doga konsepti veya muzik klasoru yok! Saf ortam sesi..."
          ffmpeg -y -stream_loop -1 -i assets/pingpong_video.mp4 -t 3600 -c copy assets/final_main.mp4
        fi
