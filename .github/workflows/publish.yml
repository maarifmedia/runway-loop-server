name: YouTube Otomasyonu - Veo 3 İşleyici

on:
  push:
    paths:
      - 'assets/current_video.mp4'  # Make.com buraya video attığında tetiklenir
  workflow_dispatch:              # Elle (manuel) başlatmak isterseniz

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Kontrol Et
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Kur
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Kimlik Bilgilerini Hazırla
      run: |
        # GitHub Secrets içindeki metinleri geçici dosyalara (JSON) dönüştürür
        echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
        echo '${{ secrets.TOKEN_JSON }}' > token.json

    - name: Videoyu İşle ve YouTube'a Yükle
      run: python server.py
