name: YouTube Otomasyonu - Veo 3 İşleyici

on:
  push:
    paths:
      - 'assets/current_video.mp4'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Depoyu Kontrol Et
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: FFmpeg Kurulumu
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Bağımlılıkları Kur
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Kimlik Bilgilerini Hazırla
      run: |
        echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
        echo "${{ secrets.TOKEN_JSON }}" | base64 --decode > token.pickle

    - name: Video Isleme
      run: |
        rm -f assets/final_main.mp4 assets/shorts_video.mp4
        
        # Sadece kopyalama (En güvenli yol)
        ffmpeg -y -stream_loop -1 -i assets/current_video.mp4 -t 3600 -c copy assets/final_main.mp4
        
        # Shorts oluşturma
        ffmpeg -y -stream_loop -1 -i assets/current_video.mp4 -vf "crop=ih*(9/16):ih:(iw-ow)/2:0" -t 59 -c:v libx264 -crf 23 assets/shorts_video.mp4
        
        mv assets/final_main.mp4 assets/current_video.mp4

    - name: Yukle
      run: python server.py
