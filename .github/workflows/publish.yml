- name: Videoyu 1 Saate Uzat ve Shorts Kes (FFmpeg)
      run: |
        # 1. Ana Videoyu 1 Saat Yap (Loop)
        ffmpeg -stream_loop -1 -i assets/current_video.mp4 -t 3600 -c copy assets/main_1hour.mp4
        
        # 2. Shorts Oluştur (Ortadan 9:16 Kes ve 59sn al)
        ffmpeg -i assets/current_video.mp4 -vf "crop=ih*(9/16):ih" -t 59 -c:v libx264 -crf 23 assets/shorts_video.mp4

    - name: Videoyu İşle ve YouTube'a Yükle
      run: python server.py
