name: YouTube Otomasyonu - Veo 3 İşleyici

on:
  push:
    paths:
      - 'assets/current_video.mp4'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Depoyu Kontrol Et
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: FFmpeg Kurulumu (Video Isleme Icin)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Bağımlılıkları Kur
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Kimlik Bilgilerini Hazırla (Base64)
      run: |
        echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
        echo "${{ secrets.TOKEN_JSON }}" | base64 --decode > token.pickle

    - name: Video Isleme (Profesyonel Crossfade Loop ve Shorts)
      run: |
        # 1. Eski kalıntıları temizle
        rm -f assets/final_main.mp4 assets/shorts_video.mp4
        
        # 2. 1 Saatlik Profesyonel Crossfade Loop (Ana Video)
        # Görüntü ve sesi senkronize ederek birbiri içine eritir
        ffmpeg -y -i assets/current_video.mp4 -filter_complex \
        "[0:v]loop=loop=245:size=32767:start=0,xfade=transition=fade:duration=1:offset=14[v]; \
         [0:a]aloop=loop=245:size=32767:start=0[a]" \
        -map "[v]" -map "[a]" -t 3600 -c:v libx264 -preset fast -crf 22 -c:a aac -b:a 192k assets/final_main.mp4
        
        # 3. 59 Saniyelik Loop ve Dikey Kesim (Shorts)
        ffmpeg -y -stream_loop -1 -i assets/current_video.mp4 -vf "crop=ih*(9/16):ih:(iw-ow)/2:0" -t 59 -c:v libx264 -crf 23 assets/shorts_video.mp4
        
        # 4. Ana Videoyu Hazırla (Isim Degistirme)
        mv assets/final_main.mp4 assets/current_video.mp4
    - name: Videoyu Isle ve YouTube'a Yukle
      run: python server.py
