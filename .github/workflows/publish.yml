name: YouTube Otomasyonu - Veo 3 İşleyici

on:
  push:
    paths:
      - 'assets/current_video.mp4'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Depoyu Kontrol Et
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: FFmpeg Kurulumu (Video Isleme Icin)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Bağımlılıkları Kur
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Kimlik Bilgilerini Hazırla (Base64)
      run: |
        echo '${{ secrets.CLIENT_SECRETS_JSON }}' > client_secrets.json
        echo "${{ secrets.TOKEN_JSON }}" | base64 --decode > token.pickle

    - name: Video Isleme (Sabit Loop ve Dikey Shorts)
      run: |
        # 1. 1 Saatlİk Sabit Loop: Zoom etkisinden kaçınmak için 'copy' modu kullanıyoruz
        # Bu işlem 9 saniyelik videoyu 3600 saniyeye (1 saat) tamamlar
        ffmpeg -stream_loop -1 -i assets/current_video.mp4 -t 3600 -c copy assets/final_main.mp4
        
        # 2. Shorts Olusturma: Videoyu tam ortadan 9:16 formatında keser
        ffmpeg -i assets/current_video.mp4 -vf "crop=ih*(9/16):ih" -t 59 -c:v libx264 -crf 23 assets/shorts_video.mp4
        
        # 3. Ana videonun ismini 'server.py'nin beklediği hale getir
        mv assets/final_main.mp4 assets/current_video.mp4

    - name: Videoyu Isle ve YouTube'a Yukle
      run: python server.py
